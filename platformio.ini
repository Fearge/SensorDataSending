; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = program_via_ArduinoISP

[env:nanodev]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_port = COM16
upload_speed = 57600
lib_deps = 
	;cnmat/OSC@^1.0.0
	beniseman/HX71708@^0.1.0
	robtillaart/HX711@^0.6.1
monitor_speed = 115200
monitor_port = COM16
build_src_filter = +<*> -<osc*> -<server*> -<transport_osc*>


[env:program_via_ArduinoISP]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_protocol = custom
upload_port = COM17
upload_speed = 19200
upload_flags =
	-C
	; use "tool-avrdude-megaavr" for the atmelmegaavr platform
	${platformio.packages_dir}/tool-avrdude/avrdude.conf
	-p
	$BOARD_MCU
	-P
	$UPLOAD_PORT
	-b
	$UPLOAD_SPEED
	-c
	stk500v1
upload_command = ${platformio.packages_dir}/tool-avrdude/avrdude.exe $UPLOAD_FLAGS -U flash:w:$SOURCE:i
build_src_filter = +<*> 
;-<osc*> -<server*> -<transport_osc*>
;run via pio run -e program_via_ArduinoISP -t upload -v
